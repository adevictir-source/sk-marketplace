<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Checkout - SK Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- =================================
         HEADER
         ================================= -->
    <header class="site-header">
        <div class="container">
            <a
                href="Index.html"
                class="logo"
            >
                SK Market
            </a>
        </div>
    </header>
    <!-- =================================
         CHECKOUT
         ================================= -->
    <main class="checkout-page">
        <div class="container">
            <div class="checkout-heading">
                <span>
                    SK Market
                </span>
                <h1>
                    Checkout
                </h1>
                <p>
                    Review your order before payment.
                </p>
            </div>
            <div class="checkout-layout">
                <!-- =================================
                     PRODUCTS
                     ================================= -->
                <section class="checkout-card">
                    <div class="checkout-card-heading">
                        <h2>
                            Your Order
                        </h2>
                        <span id="checkoutItemCount">
                            0 items
                        </span>
                    </div>
                    <div id="checkoutItems">
                        <div class="empty-cart">
                            <div class="empty-cart-icon">
                                🛒
                            </div>
                            <h2>
                                Loading checkout...
                            </h2>
                        </div>
                    </div>
                </section>
                <!-- =================================
                     ORDER SUMMARY
                     ================================= -->
                <aside class="checkout-summary">
                    <h2>
                        Order Summary
                    </h2>
                    <div class="summary-row">
                        <span>
                            Items
                        </span>
                        <span id="checkoutSummaryItems">
                            0
                        </span>
                    </div>
                    <div class="summary-row">
                        <span>
                            Subtotal
                        </span>
                        <span id="checkoutSubtotal">
                            ₦0
                        </span>
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-total">
                        <span>
                            Total
                        </span>
                        <strong id="checkoutTotal">
                            ₦0
                        </strong>
                    </div>
                    <!-- PAYMENT MESSAGE -->
                    <p
                        id="checkoutMessage"
                        class="auth-message"
                    ></p>
                    <!-- PAY BUTTON -->
                    <button
                        type="button"
                        id="payButton"
                        class="auth-button"
                    >
                        Continue to Payment
                    </button>
                    <p class="checkout-secure">
                        🔒 Secure payment powered by Paystack
                    </p>
                </aside>
            </div>
        </div>
    </main>
    <!-- =================================
         PAYSTACK
         ================================= -->
    <script src="https://js.paystack.co/v2/inline.js"></script>
    <script
        type="module"
        src="checkout.js"
    ></script>
</body>
</html>
