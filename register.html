<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SK Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-container">
            <a href="index.html" class="logo">
                SK Market
            </a>
            <div class="auth-card">
                <div class="auth-heading">
                    <span>Join SK Market</span>
                    <h1>Create Account</h1>
                    <p>
                        Create your account to continue.
                    </p>
                </div>
                <!-- EMAIL REGISTRATION -->
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerName">
                            Full name
                        </label>
                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">
                            Email address
                        </label>
                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">
                            Password
                        </label>
                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">
                            Confirm password
                        </label>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="8"
                            required
                        >
                    </div>
                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>
                    <p
                        id="registerMessage"
                        class="auth-message"
                    ></p>
                </form>
                <div class="auth-divider">
                    <span>OR</span>
                </div>
                <!-- GOOGLE -->
                <button
                    type="button"
                    class="auth-button"
                    id="googleLogin"
                >
                    🔵 Continue with Google
                </button>
                <br>
                <!-- FACEBOOK -->
                <button
                    type="button"
                    class="auth-button"
                    id="facebookLogin"
                >
                    🔵 Continue with Facebook
                </button>
                <br>
                <!-- APPLE -->
                <button
                    type="button"
                    class="auth-button"
                    id="appleLogin"
                >
                    🍎 Continue with Apple
                </button>
                <p class="auth-register">
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>
            </div>
        </div>
    </main>
    <script src="config.js"></script>
    <script
        type="module"
        src="auth.js">
    </script>
</body>
</html>
